
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>College CRM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7fb;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1px solid #f5d6e7;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #d63384;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        nav a {
            color: #a72c6b;
            text-decoration: none;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h1 {
            color: #bd2d72;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px #f0d8e5;
        }

        .btn {
            display: inline-block;
            background: #e754a1;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 9px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #c83784;
        }

        .btn-secondary {
            background: #888;
        }

        .btn-danger {
            background: #d63c50;
        }

        input, select, textarea {
            padding: 11px;
            border: 1px solid #e6cbd9;
            border-radius: 8px;
            max-width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #f3e4ec;
        }

        th {
            background: #fff0f7;
            color: #a72c6b;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
        }

        .errorlist {
            color: #d63c50;
        }

        .logout-form {
            display: inline;
        }

        .logout-button {
            border: none;
            background: none;
            color: #a72c6b;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <a href="{% url 'student_list' %}" class="logo">
        College CRM
    </a>

    <nav>
        <a href="{% url 'student_list' %}">
            Студенты
        </a>

        {% if user.is_authenticated %}
            <a href="{% url 'student_create' %}">
                Добавить студента
            </a>

            <form method="post"
                  action="{% url 'logout' %}"
                  class="logout-form">
                {% csrf_token %}
                <button type="submit" class="logout-button">
                    Выйти
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">
                Войти
            </a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
